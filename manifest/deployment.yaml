apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: node-app
  template:
    metadata:
      labels:
        app: node-app
    spec:
      containers:
      - name: node-app
        image: sachin7840/my-app:3970c1a1e281626e39100a42bae029014f28ae04
        ports:
        - containerPort: 3000
