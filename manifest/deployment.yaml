apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: node-app
  template:
    metadata:
      labels:
        app: node-app
    spec:
      containers:
      - name: node-app
        image: "sachin7840/my-app:1b6b0091eee9a4142cfe138a0f5bea1aa322c618"
        ports:
        - containerPort: 3000
