apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: node-app
  template:
    metadata:
      labels:
        app: node-app
    spec:
      containers:
      - name: node-app
        image: "sachin7840/my-app:a6f722dd7e4e307a8a86e944a29c643e19aaa7c6"
        ports:
        - containerPort: 3000
